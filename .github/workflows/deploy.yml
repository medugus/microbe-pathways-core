name: LIMS CI and Cloudflare Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
  VITE_MEDUGU_PUBLIC_BASE_URL: ${{ vars.VITE_MEDUGU_PUBLIC_BASE_URL }}
  VITE_ZONE_READER_PUBLIC_URL: ${{ vars.VITE_ZONE_READER_PUBLIC_URL }}
  VITE_MEDUGU_REQUIRE_AUTH: ${{ vars.VITE_MEDUGU_REQUIRE_AUTH }}
  VITE_MEDUGU_IPC_EMAIL: ${{ vars.VITE_MEDUGU_IPC_EMAIL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run preflight:outside-lovable
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    concurrency:
      group: medugu-lims-production
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check Cloudflare secrets are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is empty or missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or missing"; exit 1; }
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
